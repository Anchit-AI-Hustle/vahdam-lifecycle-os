# Snowflake project definition for the VAHDAM Analytics Streamlit-in-Snowflake app.
# Deploy with the Snowflake CLI:  snow streamlit deploy --replace
#
# IMPORTANT — single main file, no stray copies:
#   * main_file is streamlit_app.py (the two-section Data Analysis + Ads app).
#   * artifacts lists ONLY the files the app needs. Do NOT add a
#     "streamlit_app copy.py" (or any duplicate) here — a second app module in
#     artifacts shadows/imports over the real one and breaks the deploy.
#   * Dependencies live in environment.yml (Snowflake Anaconda channel):
#     streamlit, altair, pandas, snowflake-snowpark-python. NOTHING external —
#     no langchain-core, no snowflake-connector-python (SiS provides Snowpark and
#     the session via get_active_session()), so NO PYPI_ACCESS_INTEGRATION is
#     required.
definition_version: "2"
entities:
  vahdam_analytics:
    type: "streamlit"
    identifier:
      name: "ADSDASHBOARDUSA"          # the LIVE app object (VAHDAM_DB.MAPLEMONK) — URL stays stable
    stage: "streamlit_stage"
    query_warehouse: "COMPUTE_WH"        # change to your warehouse if different
    title: "Ads Dashboard USA"
    main_file: "streamlit_app.py"
    artifacts:
      - "streamlit_app.py"
      - "environment.yml"
      # The theme. Not optional: Snowsight's dark UI is inherited by the embedded
      # app, and st.dataframe renders on a CANVAS themed from Streamlit's JS theme
      # object rather than the DOM, so base="light" here is the only thing that
      # turns the data grids light. Omit this file and the dropdowns and tables go
      # dark again no matter what CSS the app injects.
      - ".streamlit/config.toml"
      # The Ad Campaigns Master tabs read these — the SAME four files the web
      # dashboard fetches over HTTP. Without them the governance tabs (SOP,
      # Tracker, Overview, Creative Intel, Knowledge Base, Ops) declare a gap
      # instead of rendering, because nothing is ever substituted for real data.
      - "data/ads/master-kb.json"
      - "data/ads/ads-live-snapshot.json"
      - "data/ads/ad-accounts.json"
      - "data/ads/target-ads-meta-2026-07-20.json"
