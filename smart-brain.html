<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VAHDAM Brain — VAHDAM Lifecycle OS</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/favicon.png">
<meta name="theme-color" content="#004A2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Automated Calendar">
<style>
  :root{--green:#004A2B;--gold:#AB8743;--ink:#171717;--cream:#FBF5EA;--muted:#6b7770}
  *{box-sizing:border-box} body{margin:0;background:#0a1410;color:#e8ede9;font-family:Inter,system-ui,Arial,sans-serif;padding:28px}
  .wrap{max-width:1280px;margin:0 auto}.top{display:flex;gap:18px;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap}
  .eyebrow{color:var(--gold);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:800}h1{font-family:Georgia,serif;font-size:40px;line-height:1.05;margin:8px 0 10px}p{color:#a7b5ad;line-height:1.55}
  .btn{border:0;border-radius:10px;background:var(--gold);color:#0a1410;padding:12px 16px;font-weight:800;cursor:pointer}
  .btn.secondary{background:transparent;color:#e8ede9;border:1px solid rgba(171,135,67,.35)}
  .btn:disabled{opacity:.5;cursor:wait}
  .btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
  .mkchip{border:1px solid rgba(171,135,67,.4);background:transparent;color:#cbd6ce;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer}
  .mkchip:hover{border-color:var(--gold);color:#e8ede9}
  .mkchip.on{background:var(--forest,#004A2B);color:#fff;border-color:var(--gold)}
  .akbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0 10px;padding:8px 0;border-bottom:1px solid rgba(171,135,67,.18)}
  .akstatus{font-size:12px;font-weight:700}
  .akstatus.approved{color:#8fe7b9} .akstatus.rejected{color:#e89a9a}
  .btn.ok{background:#1d6b45;color:#eafff3}.btn.no{background:transparent;color:#e89a9a;border:1px solid rgba(232,154,154,.4)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#0f1d18;border:1px solid rgba(171,135,67,.18);border-radius:16px;padding:18px}
  .card h2{font-size:16px;margin:0 0 8px}.metric{font-size:30px;color:#FBF5EA;font-weight:800}.label{font-size:11px;color:#789;letter-spacing:.12em;text-transform:uppercase}
  .wide{grid-column:span 4}.two{grid-column:span 2}
  pre{white-space:pre-wrap;word-break:break-word;background:#07100d;border:1px solid rgba(171,135,67,.16);border-radius:12px;padding:14px;max-height:420px;overflow:auto;color:#cfe0d7;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{font-size:10px;color:#789;letter-spacing:.1em;text-transform:uppercase;text-align:left;padding:8px 8px;border-bottom:1px solid rgba(171,135,67,.25)}
  td{padding:9px 8px;border-bottom:1px solid rgba(171,135,67,.1);vertical-align:top}
  tr:hover td{background:rgba(171,135,67,.05)}
  /* Calendar table: keep readable on narrow screens by scrolling horizontally */
  .tblscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  #plantable{min-width:1020px}
  #plantable th,#plantable td{white-space:nowrap;padding:12px 10px;vertical-align:top}
  #plantable tbody tr.planrow:hover td{background:rgba(171,135,67,.06)}
  #plantable td.cohort{white-space:normal;max-width:150px}
  #plantable td.obj,#plantable th.obj{white-space:normal;max-width:190px}
  #plantable td.why,#plantable th.why{white-space:normal;max-width:280px}
  #plantable td.chan,#plantable th.chan{white-space:normal;max-width:150px}
  /* Clamp long copy to 2 lines */
  .clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pill{display:inline-block;border:1px solid rgba(171,135,67,.35);border-radius:999px;padding:2px 8px;margin:1px;font-size:11px;color:#d9c18f;white-space:nowrap}
  /* Why / Analysis panel — clear focus hierarchy */
  .an-eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#AB8743;margin:0 0 6px}
  .an-focus{background:linear-gradient(90deg,rgba(0,74,43,.35),rgba(0,74,43,.08));border-left:3px solid #AB8743;border-radius:0 10px 10px 0;padding:14px 18px;margin:0 0 16px}
  .an-focus .lead{font-size:17px;line-height:1.4;color:#FBF5EA;margin:0}
  .an-focus .sub{font-size:13px;line-height:1.55;color:#c8d6cd;margin:8px 0 0}
  .an-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 16px}
  @media(max-width:720px){.an-grid{grid-template-columns:1fr}}
  .an-card{background:rgba(171,135,67,.06);border:1px solid rgba(171,135,67,.2);border-radius:10px;padding:13px 15px}
  .an-callout{background:rgba(29,107,69,.18);border:1px solid rgba(143,231,185,.3);border-radius:10px;padding:13px 15px;margin:0 0 16px}
  .an-callout .big{font-size:15px;color:#eafff3;font-weight:600}
  .an-confbar{height:9px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin:8px 0 10px}
  .an-confbar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#1d6b45,#8fe7b9)}
  .an-conf-num{font-size:26px;font-weight:800;color:#FBF5EA;font-variant-numeric:tabular-nums;line-height:1}
  .an-factor{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid rgba(171,135,67,.14);font-size:12.5px;color:#c8d6cd}
  .an-factor b{color:#e9dfc6;font-weight:600}
  .an-driver{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid rgba(171,135,67,.12)}
  .an-driver .sig{color:#AB8743;font-weight:700;font-size:12px
