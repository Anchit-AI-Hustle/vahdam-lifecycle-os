<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!--
    VAHDAM Conversational Landing Page — TEMPLATE
    ------------------------------------------------------------------
    A public, standalone landing page where the page IS an all-in-one AI
    agent: a visitor lands and immediately chats/talks to an assistant that
    answers from the VAHDAM knowledge base and guides them to buy.

    This is a reusable template the Landing Pages generator clones and fills.
    To produce a campaign LP, replace the values in the CONFIG block below
    (product, offer, hero copy, image, CTA) — everything else is wired.

    No sign-in / auth.js: this is for customers, not the internal app. It only
    needs the shared agent core (copilot.js) + the app's /api/ai/generate.
  -->
  <title>Discover your tea · VAHDAM</title>
  <meta name="theme-color" content="#004A2B">
  <style>
    :root{ --green:#004A2B; --gold:#AB8743; --ink:#171717; --cream:#FBF5EA; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:'Proxima Nova','Helvetica Neue',Arial,sans-serif; color:var(--ink); background:var(--cream); }
    .lp{ max-width:1120px; margin:0 auto; padding:26px 20px 40px; display:grid; grid-template-columns:1fr 1fr; gap:26px; align-items:stretch; min-height:100vh; }
    .hero{ display:flex; flex-direction:column; justify-content:center; }
    .eyebrow{ color:var(--gold); font-weight:700; letter-spacing:.12em; text-transform:uppercase; font-size:12px; }
    h1{ font-family:'Lao MN','Cormorant Garamond',Georgia,serif; font-weight:700; color:var(--green); font-size:40px; line-height:1.1; margin:.15em 0 .25em; }
    .promise{ font-size:17px; color:#43433c; line-height:1.6; max-width:520px; }
    .offer{ display:inline-block; margin:18px 0; background:var(--green); color:var(--cream); padding:10px 16px; border-radius:10px; font-weight:700; }
    .heroimg{ width:100%; max-width:420px; border-radius:16px; margin-top:14px; box-shadow:0 18px 50px rgba(0,0,0,.16); }
    .cta{ display:inline-block; background:var(--gold); color:var(--ink); text-decoration:none; font-weight:700; padding:13px 22px; border-radius:10px; margin-top:8px; width:fit-content; }
    #vhd-agent-mount{ min-height:560px; }
    @media(max-width:820px){ .lp{ grid-template-columns:1fr; } h1{ font-size:32px; } #vhd-agent-mount{ min-height:78vh; } }
  </style>
</head>
<body>
  <div class="lp">
    <section class="hero">
      <span class="eyebrow" id="lp-eyebrow">Single-estate · Hand-picked</span>
      <h1 id="lp-headline">Find the cup that fits your ritual</h1>
      <p class="promise" id="lp-promise">Tell our tea guide how you like to steep, when you drink, and what you're after — it will hand-pick from our single-estate origins and build your perfect order.</p>
      <span class="offer" id="lp-offer">Welcome gift: free sampler with your first order</span>
      <img class="heroimg" id="lp-img" alt="" src="https://cdn.shopify.com/s/files/1/2675/9476/files/margaret_s_hope_premium-2.jpg" />
      <a class="cta" id="lp-cta" href="https://www.vahdamteas.com" rel="noopener">Shop the collection →</a>
    </section>

    <!-- The page's primary surface: the conversational agent. -->
    <div id="vhd-agent-mount"></div>
  </div>

  <script>
    /* ── CONFIG — the generator fills this per campaign ───────────────────── */
    window.VAHDAM_AGENT_CONFIG = {
      mode: 'inline',
      // Point at the deployed app that hosts /api/ai/generate + /copilot.js.
      apiBase: 'https://vahdam-marketing-mailers-architect.vercel.app',
      serverTTS: true,           // one fixed natural voice for every visitor (free)
      ttsVoice: 'nova',
      title: 'VAHDAM Tea Guide',
      subtitle: 'Hand-picks your tea · voice enabled',
      placeholder: 'Tell me how you drink your tea…',
      greeting: "Welcome! I'm your VAHDAM tea guide. Tell me how you like to steep — black, green, herbal, iced — and the moment you drink it, and I'll hand-pick single-estate teas and build your order. You can talk to me with the mic too.",
      quick: ['Help me pick a tea', 'Best teas for mornings', 'A calming evening blend', "What's in the welcome gift?"],
      // Extra grounding so replies stay on-campaign (passed to the chat model).
      context: {
        surface: 'conversational_landing_page',
        product: 'Single-estate Darjeeling & wellness teas',
        offer: 'Free sampler with first order',
        campaign: 'all-in-one-agent',
        goal: 'recommend products from the catalog and guide to checkout'
      },
      // Hero copy — the generator only needs to edit this block; the DOM syncs.
      hero: {
        eyebrow: 'Single-estate · Hand-picked',
        headline: 'Find the cup that fits your ritual',
        promise: "Tell our tea guide how you like to steep, when you drink, and what you're after — it will hand-pick from our single-estate origins and build your perfect order.",
        offer: 'Welcome gift: free sampler with your first order',
        image: 'https://cdn.shopify.com/s/files/1/2675/9476/files/margaret_s_hope_premium-2.jpg',
        ctaText: 'Shop the collection →',
        ctaUrl: 'https://www.vahdamteas.com'
      }
    };
    // Sync hero copy from config so a campaign only edits the object above.
    (function(){
      var h = (window.VAHDAM_AGENT_CONFIG || {}).hero || {}, set = function(id, v){ var e=document.getElementById(id); if(e!=null && v!=null) e.textContent=v; };
      set('lp-eyebrow', h.eyebrow); set('lp-headline', h.headline); set('lp-promise', h.promise); set('lp-offer', h.offer);
      var img=document.getElementById('lp-img'); if(img && h.image){ img.src=h.image; img.alt=h.headline||''; }
      var cta=document.getElementById('lp-cta'); if(cta){ if(h.ctaText)cta.textContent=h.ctaText; if(h.ctaUrl)cta.href=h.ctaUrl; }
    })();
  </script>
  <!-- Shared agent core (served by the app origin). -->
  <script src="https://vahdam-marketing-mailers-architect.vercel.app/copilot.js?v=20260617" defer></script>
</body>
</html>
