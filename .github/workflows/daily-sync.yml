name: Daily Intelligence Sync (noon IST + manual)

# The full daily loop = pull READ-ONLY data from the source platforms into
# Supabase, re-analyse, re-plan the calendar, and regenerate the day's campaign
# assets (mailers / ads / landing pages). It hits the CRON_SECRET-protected
# endpoint POST /api/brain?action=cron.
#
# WHY GitHub Actions: Vercel Hobby cron jobs can only run ONCE per day, so the
# native Vercel cron covers the MIDNIGHT IST run (vercel.json: "30 18 * * *").
# This workflow adds the SECOND daily run at NOON IST, plus a manual "Run now"
# button (workflow_dispatch) for on-demand/one-time runs.
#
# SETUP (one-time): add two repo secrets under Settings -> Secrets and variables
# -> Actions:
#   CRON_SECRET   = the same value as the Vercel CRON_SECRET env var
#   APP_BASE_URL  = https://vahdam-lifecycle-os.anchit-tandon.com   (optional;
#                   falls back to that default below if unset)

on:
  workflow_dispatch: {}            # manual "Run now" for the one-time run
  schedule:
    - cron: '30 6 * * *'           # 06:30 UTC = 12:00 noon IST

concurrency:
  group: daily-intelligence-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
    steps:
      # Unconfigured is not broken: a missing setup secret is reported as a skip
      # with an actionable notice, not as a daily red failure. A configured but
      # failing endpoint still fails hard in the step below.
      - name: Preflight (is this integration configured?)
        id: pre
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Daily sync not configured::CRON_SECRET repo secret is not set. Nothing ran. This is a setup gap, not a failure."
            {
              echo "### Daily sync: not configured yet"
              echo
              echo "Nothing ran, and this run is **not** counted as a failure."
              echo "Add \`CRON_SECRET\` (same value as the \`CRON_SECRET\` env var in Vercel) under"
              echo "Settings -> Secrets and variables -> Actions."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger the daily loop (read-only pull -> analyse -> re-plan -> regenerate)
        if: steps.pre.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="${APP_BASE_URL:-https://vahdam-lifecycle-os.anchit-tandon.com}"
          curl --fail-with-body -sS --max-time 300 --retry 2 --retry-delay 10 --retry-connrefused \
            -X POST "${BASE%/}/api/brain?action=cron" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"
