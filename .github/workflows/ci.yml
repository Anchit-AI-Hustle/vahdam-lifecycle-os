name: CI
on:
  push: { branches: [main] }
  pull_request: {}
# Least-privilege token: these jobs only read the checked-out repo.
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub's default job timeout is SIX HOURS, and nothing here overrode it, so
    # a hung step just sat there: one `npx playwright install` on this repo ran
    # 5h49m before anyone noticed and cancelled it. A hang and a slow run look
    # identical while they are happening; a timeout is what makes them different.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: HTML smoke test
        run: |
          test -f vahdam_mailer_architect_v34.html
          node -e "const fs=require('fs');const s=fs.readFileSync('vahdam_mailer_architect_v34.html','utf8');if(!s.includes('<!DOCTYPE html>'))process.exit(1);console.log('v34 OK ('+s.length+' bytes)')"
      - name: JS syntax check (api / lib / workers / scripts + shared shells)
        run: |
          set -e
          for f in $(find api lib workers scripts -name '*.js'); do node --check "$f"; done
          # GLOB the root shared scripts, never a hand-kept list. The list version
          # named 5 files while 13 existed, so motion.js (injected by auth.js on
          # EVERY page), data-analysis-extensions.js and sync-bar.js were all
          # unchecked — a syntax error in any of them breaks every page and CI
          # still passes. A list that must be updated by hand is a list that gets
          # forgotten; the glob cannot omit a file that exists.
          for f in *.js; do [ -f "$f" ] && node --check "$f"; done
          echo "All JS parses cleanly ($(ls *.js | wc -l) root scripts + api/lib/workers/scripts)"
      - name: Function-count guard (Hobby cap = 12)
        # Vercel counts every non-_shared file under api/ as a Serverless Function.
        # The vercel.json "functions" map is OPTIONAL per-function config, so a file
        # need not appear there — the only hard limit is the count (12 on Hobby).
        run: |
          node -e "const cp=require('child_process');const files=cp.execSync(\"find api -name '*.js' -not -path '*/_shared/*'\").toString().trim().split('\n').filter(Boolean);if(files.length>12){console.error('FAIL: '+files.length+' function files exceeds Hobby cap of 12:\n  '+files.join('\n  '));process.exit(1);}console.log('OK: '+files.length+'/12 Serverless Function files (Hobby cap = 12)');"
      - name: Build catalog
        run: npm run build

  e2e:
    name: Visual + invariant tests (Playwright)
    runs-on: ubuntu-latest
    # See the note on `build` above. 40 minutes is well clear of a healthy run
    # (the suite spends ~236s of test time per project after the third-party
    # waits were removed, against 422s before) and far below six hours.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Build catalog
        run: npm run build
      - name: Install Playwright browsers
        # This is the step that hung. Bound it on its own so a stalled download
        # fails in twelve minutes with the log pointing at the download, instead
        # of eating the whole job budget and reporting as "the test suite".
        timeout-minutes: 12
        run: npx playwright install --with-deps
      - name: Run Playwright suite
        # No --reporter override here. It replaces the whole reporter array from
        # playwright.config.js, so the html reporter never ran and tests/report/
        # was never created - which is why every failing run logged
        # "No files were found with the provided path: tests/report/" and threw
        # away its own evidence. The config already lists 'list' first, so the
        # console output is unchanged.
        run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          # Both paths. tests/report/ is the browsable HTML report; test-results/
          # is where the screenshot, video and trace for each failure actually
          # land, and it was never uploaded at all. Without them a failure that
          # only reproduces on an engine the developer cannot install (WebKit is
          # not downloadable from the dev sandbox) cannot be diagnosed by anyone.
          path: |
            tests/report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
